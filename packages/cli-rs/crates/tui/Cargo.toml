[package]
name = "wormagent-tui"
description = "The full-screen TUI (T.1)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
opentui.workspace = true
wormagent-api.workspace = true
wormagent-local.workspace = true
wormagent-ui.workspace = true
wormagent-store.workspace = true
wormagent-plugin.workspace = true
wormagent-drive.workspace = true
wormagent-util = { workspace = true, features = ["ring"] }
base64.workspace = true
futures-util.workspace = true
indexmap.workspace = true
log.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
unicode-width.workspace = true
url.workspace = true
rand.workspace = true

[features]
# TypeScript TUI plugins on the JS host: the pipe carrier, the JS host and its embedded `host.ts` and `compat.js`
# (ts-feature). On by default; `WORMAGENT_PLUGIN_JS=0` still turns the host off at run time.
default = ["ts", "luau"]
ts = ["wormagent-plugin/ts"]
# Luau plugins, in process. On by default; `WORMAGENT_PLUGIN_LUAU=0` turns them off at run time.
luau = ["wormagent-plugin/luau"]

[dev-dependencies]
bytes.workspace = true
# The performance scenarios (`tests/all/perf.rs`): the process's CPU time and the thread's instruction counter.
libc.workspace = true
wormagent-latex.workspace = true
wormagent-mermaid.workspace = true
wormagent-parity.workspace = true
# The board plugin's source, linked into the carrier tests as a plugin crate links it.
wormagent-plugin-abi.workspace = true
